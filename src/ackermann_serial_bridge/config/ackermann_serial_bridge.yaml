ackermann_serial_bridge:
  ros__parameters:
    # Serial port
    port: "/dev/chassis"
    baudrate: 115200

    # Send / receive rates (Hz)
    cmd_send_rate: 5.0
    read_rate: 100.0

    # Command timeout: if no /cmd_vel received within this many seconds,
    # the bridge automatically sends zero velocity.
    command_timeout: 5.0

    # Speed limits (applied to ROS /cmd_vel input before conversion)
    max_linear_speed: 6.0    # m/s
    max_angular_speed: 2.0   # rad/s

    # Yaw sign convention:
    #   ros_wz   = yaw_sign * serial_wz   (uplink / odometry)
    #   serial_wz = yaw_sign * ros_wz     (downlink / cmd_vel)
    # Use 1.0 when positive ROS angular.z should turn the chassis left.
    yaw_sign: 1.0

    # Odometry
    publish_odom: true
    publish_tf: false
    frame_id: "odom"
    base_frame_id: "base_link"

    # Republish mode (optional):
    # When enabled, subscribes to input_topic instead of /cmd_vel,
    # and forwards at cmd_send_rate with timeout-based zero-velocity.
    republish: false
    input_topic: "/cmd_vel_in"
    republish_timeout: 2.0
