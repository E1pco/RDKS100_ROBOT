cmd_vel_republisher:
  ros__parameters:
    # Republish rate (Hz)
    rate: 5.0

    # Input topic (from teleop / nav2 / ros2 topic pub)
    input_topic: "/cmd_vel_in"

    # Output topic (consumed by ackermann_serial_bridge)
    output_topic: "/cmd_vel"

    # If no new command within this many seconds, send zero velocity
    timeout: 2.0
