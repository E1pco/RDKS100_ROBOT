pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "base_link"
    transform_tolerance: 0.02
    min_height: -0.20
    max_height: 0.40
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.20
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0
    stamp_with_ros_time: true
    stamp_with_zero_time: false
    stamp_offset_sec: 0.65
