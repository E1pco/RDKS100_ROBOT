"""Launch file for arm bringup.

Starts follower_node, camera_node, ackermann serial bridge, and optional
mono EdgeSAM realtime segmentation.

Usage:
  ros2 launch arm arm_bringup.launch.py
  ros2 launch arm arm_bringup.launch.py port:=/dev/arm device:=/dev/video0
  ros2 launch arm arm_bringup.launch.py enable_segmentation:=false
"""

import os

from ament_index_python.packages import get_package_share_directory
from launch import LaunchDescription
from launch.actions import DeclareLaunchArgument, IncludeLaunchDescription, SetEnvironmentVariable
from launch.conditions import IfCondition
from launch.launch_description_sources import PythonLaunchDescriptionSource
from launch.substitutions import LaunchConfiguration
from launch_ros.actions import Node


def generate_launch_description() -> LaunchDescription:
    # --- Arguments ---
    port_arg = DeclareLaunchArgument(
        'port',
        default_value='/dev/arm',
        description='Serial port for the arm',
    )
    device_arg = DeclareLaunchArgument(
        'device',
        default_value='/dev/video0',
        description='Camera device path',
    )
    baudrate_arg = DeclareLaunchArgument(
        'baudrate',
        default_value='1000000',
        description='Serial baudrate for the arm',
    )
    speed_arg = DeclareLaunchArgument(
        'speed',
        default_value='1200',
        description='Follower servo speed',
    )
    chassis_port_arg = DeclareLaunchArgument(
        'chassis_port',
        default_value='/dev/chassis',
        description='Serial port for the chassis',
    )
    enable_segmentation_arg = DeclareLaunchArgument(
        'enable_segmentation',
        default_value='true',
        description='Start mono_edgesam realtime segmentation from /camera/image_raw',
    )

    # --- Nodes ---
    follower_node = Node(
        package='arm',
        executable='follower_node',
        name='follower_node',
        output='screen',
        parameters=[{
            'port': LaunchConfiguration('port'),
            'baudrate': LaunchConfiguration('baudrate'),
            'speed': LaunchConfiguration('speed'),
        }],
    )

    camera_node = Node(
        package='arm',
        executable='camera_node',
        name='camera_node',
        output='screen',
        parameters=[{
            'device': LaunchConfiguration('device'),
            'width': 640,
            'height': 480,
            'fps': 30.0,
        }],
    )

    # Ackermann serial bridge (??)
    ackermann_share = get_package_share_directory('ackermann_serial_bridge')
    chassis_config = os.path.join(ackermann_share, 'config', 'ackermann_serial_bridge.yaml')
    chassis_node = Node(
        package='ackermann_serial_bridge',
        executable='serial_bridge_node',
        name='ackermann_serial_bridge',
        output='screen',
        parameters=[
            chassis_config,
            {'port': LaunchConfiguration('chassis_port')},
        ],
    )

    mono_edgesam_share = get_package_share_directory('mono_edgesam')
    segmentation_launch_file = os.path.join(
        mono_edgesam_share, 'launch', 's100', 'sam_with_dosod.launch.py')
    if not os.path.exists(segmentation_launch_file):
        segmentation_launch_file = (
            '/home/sunrise/fast_ws/src/mono_edgesam/launch/s100/sam_with_dosod.launch.py')

    segmentation_launch = IncludeLaunchDescription(
        PythonLaunchDescriptionSource(segmentation_launch_file),
        condition=IfCondition(LaunchConfiguration('enable_segmentation')),
        launch_arguments={
            'sam_ros_img_sub_topic_name': '/camera/image_raw',
            'sam_image_width': '640',
            'sam_image_height': '480',
            'sam_codec_in_format': 'bgr8',
            'sam_max_rois': '0',
            'sam_cache_len_limit': '1',
            'sam_websocket_output_fps': '10',
            'sam_websocket_image_topic': '/segmentation/image_jpeg',
        }.items(),
    )

    return LaunchDescription([
        port_arg,
        device_arg,
        baudrate_arg,
        speed_arg,
        chassis_port_arg,
        enable_segmentation_arg,
        SetEnvironmentVariable('CAM_TYPE', 'ros'),
        follower_node,
        camera_node,
        chassis_node,
        segmentation_launch,
    ])
